[package]
edition = "2021"
license = "EUPL-1.2"
name = "relbo"
version = "0.1.0"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.13", features = ["derive", "env"] }
config = { version = "0.15.22", default-features = false, features = ["toml"] }
derive_builder = "0.20.0"
gitlab = "0.1710.0"
http = "1.1.0"
itertools = "0.14.0"
jiff = { version = "0.2.0", features = ["serde"] }
owo-colors = "4.0.0"
semver = { version = "1.0.23", features = ["serde"] }
serde = { version = "1.0.204", features = ["derive"] }
thiserror = "2.0.18"
url = { version = "2.5.2", features = ["serde"] }
urlencoding = "2"

[dev-dependencies]
derive_more = { version = "2.0.0", features = [
  "as_ref",
  "deref",
  "display",
  "into",
] }
insta = "1.47.2"
mockall = "0.14.0"
pretty_assertions = "1.4.0"
strip-ansi-escapes = "0.2.0"
