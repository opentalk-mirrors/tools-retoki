[package]
name = "retoki"
version = "0.5.4"
edition = "2021"
description = "release toolkit - tools for bundling product releases"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.79"
clap = { version = "4.4.18", features = ["derive"] }
derive_more = "0.99.17"
gitlab = "0.1608.0"
indexmap = { version = "2.2.1", features = ["serde"] }
owo-colors = "4.0.0"
semver = { version = "1.0.21", features = ["serde"] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = { version = "1.0.113" }
serde_yaml = "0.9.31"
tabled = "0.15.0"
tera = "1.19.1"
time = { version = "0.3.31", features = ["serde", "macros", "serde-human-readable", "serde-well-known"] }
url = "2.5.0"
