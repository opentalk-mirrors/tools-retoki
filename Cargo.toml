[package]
name = "retoki"
version = "0.1.0"
edition = "2021"
description = "release toolkit - tools for bundling product releases"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.4.4", features = ["derive"] }
semver = { version = "1.0.19", features = ["serde"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
tera = "1.19.1"
time = { version = "0.3.28", features = ["serde", "macros", "serde-human-readable"] }
