[package]
name = "retoki"
version = "0.3.0"
edition = "2021"
description = "release toolkit - tools for bundling product releases"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.76"
clap = { version = "4.4.4", features = ["derive"] }
derive_more = "0.99.17"
semver = { version = "1.0.19", features = ["serde"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = { version = "1.0.108" }
serde_yaml = "0.9.29"
tabled = "0.15.0"
tera = "1.19.1"
time = { version = "0.3.31", features = ["serde", "macros", "serde-human-readable", "serde-well-known"] }
